<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light dark">
<title>原神素材_R0.30</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{ --bg:#0b0c10; --panel:#14171b; --text:#e9edf1; --muted:#a7b0bd; --accent:#6bb8ff; --chip:#1e232a; --border:#2a3038; --ok:#4ad295; --danger:#ff6b6b; --shadow:0 8px 22px rgba(0,0,0,.28); }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fb; --panel:#ffffff; --text:#0f1720; --muted:#5f6b7a; --accent:#0a6ad9; --chip:#eef3f8; --border:#e6ebf1; --shadow:0 8px 22px rgba(0,0,0,.08);}
  }
  body.theme-dark{ --bg:#0b0c10; --panel:#14171b; --text:#e9edf1; --muted:#a7b0bd; --accent:#6bb8ff; --chip:#1e232a; --border:#2a3038; --ok:#4ad295; --danger:#ff6b6b; --shadow:0 8px 22px rgba(0,0,0,.28); }
  body.theme-light{ --bg:#f6f8fb; --panel:#ffffff; --text:#0f1720; --muted:#5f6b7a; --accent:#0a6ad9; --chip:#eef3f8; --border:#e6ebf1; --shadow:0 8px 22px rgba(0,0,0,.08); }

  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif}
  header{position:sticky;top:0;z-index:1300;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
  .hamburger{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);display:grid;place-items:center}
  .title{font-weight:700;font-size:16px}
  .subtitle{color:var(--muted);font-size:12px}
  main{padding:14px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chip{padding:8px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--border);font-size:12px;color:var(--text)}
  .chip[aria-pressed="true"]{outline:2px solid var(--accent)}
  .list{display:grid;gap:10px}
  .item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
  .item h3{margin:0 0 6px 0;font-size:15px}
  .muted{color:var(--muted);font-size:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--chip);font-size:11px;margin-right:6px}
  .grid{display:grid;gap:10px}
  .search{display:flex;gap:8px;margin:8px 0}
  .search input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--chip);color:var(--text)}
  nav.drawer{position:fixed;inset:0 30% 0 0;max-width:320px;transform:translateX(-100%);transition:transform .25s ease;z-index:1200;background:var(--panel);border-right:1px solid var(--border);box-shadow:var(--shadow);padding:14px;padding-top:calc(78px + env(safe-area-inset-top))}
  nav.drawer.open{transform:none}
  .menu a{display:block;padding:12px 8px;border-radius:10px;color:var(--text);text-decoration:none}
  .menu a.active{background:var(--chip);border:1px solid var(--border)}
  .divider{height:1px;background:var(--border);margin:10px 0}
  details summary{cursor:pointer;user-select:none}
  .btn{white-space:nowrap;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--chip);color:var(--text);font-size:13px}
  .btn.danger{color:var(--danger)}
  .chars{margin-top:6px;line-height:1.9}
  .r5{border-color:#c9a14a}
  .r4{border-color:#9a7bd6}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:6px;font-size:13px}
  .kv>div:nth-child(odd){color:var(--muted)}
</style>
</head>
<body>
  <header>
    <button id="btnMenu" class="hamburger" aria-label="メニュー" title="メニュー">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
      </svg>
    </button>
    <div>
      <div class="title" id="appTitle">原神 曜日素材ビュー（自動更新）</div>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <button id="btnTheme" class="btn" aria-label="テーマ切替" title="テーマ切替">自動</button>
    <button id="btnRefresh" class="btn" aria-label="データ更新" style="margin-left:auto">データ更新</button>
  </header>

  <!-- ドロワー背面のオーバーレイ（タップで閉じる） -->
  <div id="overlay" style="position:fixed;inset:0;display:none;background:rgba(0,0,0,.35);z-index:1100"></div>

  <nav id="drawer" class="drawer" aria-hidden="true" aria-label="ナビゲーション">
    <div class="menu">
      <a href="#" data-route="today" class="active">今日の曜日素材</a>
      <a href="#" data-route="characters">キャラ選択</a>
      <a href="#" data-route="about">このアプリについて</a>
    </div>
    <div class="muted" style="margin-top:8px">
      ・データは GitHub Actions が毎日 genshin-db から自動生成した genshin-data.json を読み込みます。<br>
      ・オフラインでも前回取得したデータ（キャッシュ）で動作します。
    </div>
  </nav>

  <main>
    <!-- Today -->
    <section id="view-today" class="grid" aria-live="polite">
      <div class="panel">
        <div class="chips" id="dayChips"></div>
        <div class="chips" id="regionChips"></div>
        <div class="item"><strong>天賦素材（秘境）</strong> <span id="todayLabel" class="badge"></span></div>
        <div id="todayTalent" class="list"></div>
        <div class="divider"></div>
        <div class="item"><strong>武器突破素材（秘境）</strong></div>
        <div id="todayWeapon" class="list"></div>
      </div>
    </section>

    <!-- Characters -->
    <section id="view-characters" class="grid" style="display:none">
      <div class="panel">
        <div class="search"><input id="searchInput" type="search" placeholder="キャラ名で検索（例：宵宮）" enterkeyhint="search" /></div>
        <div class="chips" id="elementChips"></div>
        <div class="chips" id="weaponChips"></div>
        <div id="charList" class="list"></div>
      </div>
    </section>

    <!-- About -->
    <section id="view-about" class="grid" style="display:none">
      <div class="panel">
        <div class="item"><strong>データ</strong>
          <div id="dataInfo" class="kv"></div>
        </div>
        <div class="divider"></div>
        <div class="item"><strong>ローカルJSON（手動上書き）とキャッシュ</strong>
          <div class="muted" style="margin-top:4px">キャラの天賦本などを手動で上書きしたい場合に使います（key が一致するキャラを上書き）。</div>
          <div class="search" style="gap:8px;flex-wrap:wrap">
            <button id="btnImport" class="btn">ローカルJSONを読み込み</button>
            <button id="btnExport" class="btn">現在のデータを書き出し</button>
            <button id="btnReset" class="btn danger">キャッシュ削除</button>
            <span id="localInfo" class="muted"></span>
          </div>
          <input id="fileLocal" type="file" accept=".json,application/json" style="display:none" />
        </div>
      </div>
    </section>
  </main>

<script>
/* ===== 設定 ===== */
// 同じフォルダの genshin-data.json（GitHub Actions が毎日更新）を最優先で読む。
// HTML をローカル保存して開いた場合などは、公開URLのデータを読みに行く。
const DATA_URLS = [
  "./genshin-data.json",
  "https://sousikifuyou.github.io/tools/ios/iphone-genshin-materials/genshin-data.json"
];
// 原神の日付切替は サーバー時間 4:00（アジアサーバー UTC+8 → 日本時間 5:00）
const SERVER_UTC_OFFSET_H = 8;
const DAILY_RESET_H = 4;

/* ===== 基本ラベル ===== */
const WEEK=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WEEK_JA={Sun:"日",Mon:"月",Tue:"火",Wed:"水",Thu:"木",Fri:"金",Sat:"土"};
const ELABEL={Pyro:"炎",Hydro:"水",Electro:"雷",Cryo:"氷",Anemo:"風",Geo:"岩",Dendro:"草"};
const WLABEL={Sword:"片手剣",Claymore:"両手剣",Polearm:"長柄武器",Bow:"弓",Catalyst:"法器"};

/* ===== 取得できない場合の最小データ（天賦本のみ） ===== */
const FALLBACK_DATA={schema:1,generatedAt:null,source:{name:"内蔵データ",version:"",gameVersion:""},
  talentSeries:[
    ["freedom","「自由」","モンド",0],["resistance","「抗争」","モンド",1],["ballad","「詩文」","モンド",2],
    ["prosperity","「繁栄」","璃月",0],["diligence","「勤労」","璃月",1],["gold","「黄金」","璃月",2],
    ["transience","「浮世」","稲妻",0],["elegance","「風雅」","稲妻",1],["light","「天光」","稲妻",2],
    ["admonition","「忠言」","スメール",0],["ingenuity","「創意」","スメール",1],["praxis","「篤行」","スメール",2],
    ["equity","「公平」","フォンテーヌ",0],["justice","「正義」","フォンテーヌ",1],["order","「秩序」","フォンテーヌ",2],
    ["contention","「角逐」","ナタ",0],["kindling","「焚燼」","ナタ",1],["conflict","「紛争」","ナタ",2]
  ].map(([key,name,region,d])=>({key,name,region,days:[["Mon","Thu","Sun"],["Tue","Fri","Sun"],["Wed","Sat","Sun"]][d],items:[]})),
  weaponSeries:[],characters:[],weapons:[]};

/* ===== ストレージキー ===== */
const K={ DATA:"genshin-data-v4", FETCHED_AT:"genshin-data-fetched-at-v4", FROM:"genshin-data-from-v4", LOCAL_OVERRIDES:"local-overrides-v1", THEME:"theme-pref-v1" };
// 旧バージョンのキャッシュを掃除
(function cleanupOld(){try{localStorage.removeItem("genshin-app-v3");for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith("ambr-avatar-"))localStorage.removeItem(k);}}catch{}})();

/* ===== ユーティリティ ===== */
const $=(s)=>document.querySelector(s);
const safe=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const uniq=(a)=>[...new Set(a)];
const asArray=(v)=>v==null?[]:(Array.isArray(v)?v:[v]);
function gameDayKey(){const t=new Date(Date.now()+(SERVER_UTC_OFFSET_H-DAILY_RESET_H)*3600e3);return WEEK[t.getUTCDay()];}
function fmtDate(iso){if(!iso)return"—";const d=new Date(iso);return isNaN(d)?"—":d.toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});}
async function fetchJSON(url,{timeout=12000}={}){const ctl=new AbortController();const id=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(url,{cache:"no-cache",signal:ctl.signal});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json();}finally{clearTimeout(id);}}
const isValidData=(d)=>d&&Array.isArray(d.talentSeries)&&d.talentSeries.length&&Array.isArray(d.characters);

/* ===== アプリ状態 ===== */
let appData=FALLBACK_DATA;
let dataFrom="内蔵データ";

/* ===== ローカル上書き（手動インポート） ===== */
function normalizeLocalSchema(j){if(Array.isArray(j))return{characters:j};if(j&&typeof j==="object"&&Array.isArray(j.characters))return j;return{characters:[]};}
function normalizeOverride(x){const o={key:String(x.key||x.id||x.slug||"").trim()};if(x.name)o.name=String(x.name).trim();const el=x.element||x.vision;if(el)o.element=el;const wp=x.weapon||x.weaponType;if(wp)o.weapon=wp;const tb=x.talentBooks||x.talent;if(tb)o.talentBooks=asArray(tb);return o;}
function getOverrides(){try{const p=JSON.parse(localStorage.getItem(K.LOCAL_OVERRIDES)||"null");return p?normalizeLocalSchema(p).characters.map(normalizeOverride).filter(x=>x.key):[];}catch{return[];}}
function applyOverrides(data){
  const ov=getOverrides(); if(!ov.length) return data;
  const m=new Map(data.characters.map(c=>[c.key,c]));
  for(const o of ov){ const base=m.get(o.key); if(base) m.set(o.key,{...base,...o}); else if(o.name) m.set(o.key,{ascension:{},talentBooks:[],...o}); }
  return {...data,characters:[...m.values()]};
}

/* ===== データ読み込み ===== */
function loadCached(){try{const d=JSON.parse(localStorage.getItem(K.DATA)||"null");if(isValidData(d)){appData=d;dataFrom=localStorage.getItem(K.FROM)||"キャッシュ";return true;}}catch{}return false;}
async function loadLatest(){
  for(const url of DATA_URLS){
    if(url.startsWith("./")&&!/^https?:$/i.test(location.protocol)) continue;
    try{
      const d=await fetchJSON(url);
      if(!isValidData(d)) throw new Error("invalid data");
      appData=d; dataFrom=url.startsWith("./")?"同じサイトの genshin-data.json":"公開サイトの genshin-data.json";
      try{localStorage.setItem(K.DATA,JSON.stringify(d));localStorage.setItem(K.FETCHED_AT,new Date().toISOString());localStorage.setItem(K.FROM,dataFrom);}catch{}
      return true;
    }catch(e){ console.warn("data fetch failed:",url,e); }
  }
  return false;
}
function view(){ return applyOverrides(appData); }

/* ===== テーマ ===== */
function applyTheme(pref,{save=true}={}){document.body.classList.remove("theme-dark","theme-light");if(pref==="dark")document.body.classList.add("theme-dark");if(pref==="light")document.body.classList.add("theme-light");const b=$("#btnTheme");if(b){b.textContent=pref==="auto"?"自動":(pref==="dark"?"🌙":"☀️");b.setAttribute("aria-label",`テーマ切替（現在：${pref==="auto"?"自動":pref==="dark"?"ダーク":"ライト"}）`);}if(save)localStorage.setItem(K.THEME,pref);}
function nextTheme(p){if(p==="auto")return"dark";if(p==="dark")return"light";return"auto";}
const mqlDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
if(mqlDark&&mqlDark.addEventListener){mqlDark.addEventListener("change",()=>{if((localStorage.getItem(K.THEME)||"auto")==="auto")applyTheme("auto",{save:false});});}
$("#btnTheme").onclick=()=>{const n=nextTheme(localStorage.getItem(K.THEME)||"auto");applyTheme(n);toast(`テーマ: ${n==="auto"?"自動":n==="dark"?"ダーク":"ライト"}`);};

/* ===== チップ共通 ===== */
function makeChips(container,options,onChange){
  container.innerHTML="";
  options.forEach(({value,label},i)=>{
    const b=document.createElement("button"); b.className="chip"; b.textContent=label; b.dataset.value=value;
    b.setAttribute("aria-pressed",i===0?"true":"false");
    b.onclick=()=>{container.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");onChange();};
    container.appendChild(b);
  });
}
const chipValue=(container)=>container.querySelector('.chip[aria-pressed="true"]')?.dataset.value;
function keepChip(container,value){if(value==null)return;const b=[...container.querySelectorAll(".chip")].find(c=>c.dataset.value===value);if(b){container.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");}}
const charBadge=(c)=>`<span class="badge ${c.rarity===5?"r5":c.rarity===4?"r4":""}">${safe(c.name)}</span>`;
const daysText=(days)=>(days||[]).map(d=>WEEK_JA[d]).join("・");

/* ===== 画面: ルーティング ===== */
let currentRoute="today";
function setRoute(route){
  currentRoute=route;
  document.querySelectorAll(".menu a").forEach(a=>a.classList.toggle("active",a.dataset.route===route));
  $("#view-today").style.display=route==="today"?"grid":"none";
  $("#view-characters").style.display=route==="characters"?"grid":"none";
  $("#view-about").style.display=route==="about"?"grid":"none";
  $("#subtitle").textContent=route==="today"?"今日の曜日素材":route==="characters"?"キャラ選択":"このアプリについて";
  if(route==="today") renderToday();
  if(route==="characters") renderCharacters();
  if(route==="about") renderAbout();
}

/* ===== 画面: 今日の曜日素材 ===== */
function renderToday(){
  const data=view();
  const dc=$("#dayChips"), rc=$("#regionChips");
  const prevDay=chipValue(dc), prevRegion=chipValue(rc);
  makeChips(dc,[{value:"today",label:"今日"},...["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>({value:d,label:WEEK_JA[d]}))],list);
  const regions=uniq(data.talentSeries.map(x=>x.region).concat((data.weaponSeries||[]).map(x=>x.region)).filter(Boolean));
  makeChips(rc,[{value:"all",label:"すべて"},...regions.map(r=>({value:r,label:r}))],list);
  keepChip(dc,prevDay); keepChip(rc,prevRegion);

  function list(){
    const sel=chipValue(dc)||"today"; const w=sel==="today"?gameDayKey():sel; const region=chipValue(rc)||"all";
    $("#todayLabel").textContent=`表示中（${WEEK_JA[w]}曜${sel==="today"?"・今日":""}）`;
    const inRegion=(s)=>region==="all"||s.region===region;
    const openToday=(s)=>w==="Sun"||(s.days||[]).includes(w);

    const usersOf=new Map();
    for(const c of data.characters){ for(const b of asArray(c.talentBooks)){ if(!usersOf.has(b))usersOf.set(b,[]); usersOf.get(b).push(c);} }

    const tList=$("#todayTalent"); tList.innerHTML="";
    if(w==="Sun"){const d=document.createElement("div");d.className="muted";d.textContent="日曜は全シリーズ開放。";tList.appendChild(d);}
    for(const s of data.talentSeries.filter(openToday).filter(inRegion)){
      const users=(usersOf.get(s.key)||[]).slice().sort((a,b)=>(b.rarity||0)-(a.rarity||0));
      const el=document.createElement("div"); el.className="item";
      el.innerHTML=`<h3>${safe(s.name)} <span class="badge">${safe(s.region)}</span></h3>
        <div class="muted">開放曜日：${daysText(s.days)}</div>
        <div class="chars">使用キャラ： ${users.length?users.map(charBadge).join(" "):'<span class="muted">該当なし</span>'}</div>`;
      tList.appendChild(el);
    }

    const weaponsOf=new Map();
    for(const wp of (data.weapons||[])){ if(!weaponsOf.has(wp.series))weaponsOf.set(wp.series,[]); weaponsOf.get(wp.series).push(wp); }
    const wList=$("#todayWeapon"); wList.innerHTML="";
    const ws=(data.weaponSeries||[]).filter(openToday).filter(inRegion);
    if(!ws.length){const d=document.createElement("div");d.className="muted";d.textContent="武器素材データがありません（データ更新を試してください）。";wList.appendChild(d);}
    for(const s of ws){
      const weps=(weaponsOf.get(s.key)||[]);
      const el=document.createElement("details"); el.className="item";
      el.innerHTML=`<summary><h3 style="display:inline">${safe(s.name)}</h3> <span class="badge">${safe(s.region)}</span></summary>
        <div class="muted">開放曜日：${daysText(s.days)}</div>
        ${s.items&&s.items.length?`<div class="muted">素材：${s.items.map(safe).join(" → ")}</div>`:""}
        <div class="chars">使用武器（★4以上）： ${weps.length?weps.map(x=>`<span class="badge ${x.rarity===5?"r5":"r4"}">${safe(x.name)}</span>`).join(" "):'<span class="muted">—</span>'}</div>`;
      wList.appendChild(el);
    }
  }
  list();
}

/* ===== 画面: キャラ選択 ===== */
function renderCharacters(){
  const data=view();
  const ec=$("#elementChips"), wc=$("#weaponChips");
  const prevE=chipValue(ec), prevW=chipValue(wc);
  makeChips(ec,[{value:"All",label:"元素：すべて"},...Object.keys(ELABEL).map(e=>({value:e,label:ELABEL[e]}))],list);
  makeChips(wc,[{value:"All",label:"武器：すべて"},...Object.keys(WLABEL).map(w=>({value:w,label:WLABEL[w]}))],list);
  keepChip(ec,prevE); keepChip(wc,prevW);
  $("#searchInput").oninput=()=>list();
  const seriesByKey=new Map(data.talentSeries.map(s=>[s.key,s]));
  const today=gameDayKey();

  function list(){
    const q=($("#searchInput").value||"").trim().toLowerCase();
    const e=chipValue(ec)||"All", w=chipValue(wc)||"All";
    const out=$("#charList"); out.innerHTML="";
    const arr=data.characters
      .filter(c=>e==="All"||c.element===e)
      .filter(c=>w==="All"||c.weapon===w)
      .filter(c=>!q||String(c.name).toLowerCase().includes(q)||String(c.key).includes(q))
      .slice().reverse(); // 新しいキャラを上に
    if(!arr.length){const d=document.createElement("div"); d.className="muted"; d.textContent="該当キャラが見つかりません。"; out.appendChild(d); return;}

    for(const c of arr){
      const books=asArray(c.talentBooks).map(k=>seriesByKey.get(k)).filter(Boolean);
      const openNow=books.some(s=>today==="Sun"||s.days.includes(today));
      const a=c.ascension||{};
      const row=(label,v)=>v?`<div>${label}</div><div>${safe(v)}</div>`:"";
      const det=document.createElement("details"); det.className="item";
      det.innerHTML=`<summary><h3 style="display:inline">${safe(c.name)}</h3>
          <span class="badge">${ELABEL[c.element]||safe(c.element)||"?"}</span>
          <span class="badge">${WLABEL[c.weapon]||safe(c.weapon)||"?"}</span>
          ${c.rarity?`<span class="badge ${c.rarity===5?"r5":"r4"}">★${c.rarity}</span>`:""}
          ${openNow?'<span class="badge" style="color:var(--ok)">今日天賦OK</span>':""}
        </summary>
        <div class="kv">
          <div>天賦本</div><div>${books.length?books.map(s=>`<span class="badge">${safe(s.name)}</span><span class="muted">（${daysText(s.days)}）</span>`).join(" "):'<span class="muted">不明</span>'}</div>
          ${row("週ボス",c.weeklyBoss)}
          ${row("天賦 敵素材",c.talentCommon)}
          ${row("突破 宝石",a.gem)}
          ${row("突破 ボス",a.boss)}
          ${row("地域特産",a.local)}
          ${row("突破 敵素材",a.common)}
          ${row("地域",c.region)}
          ${row("実装",c.version?`Ver.${c.version}`:"")}
        </div>`;
      out.appendChild(det);
    }
  }
  list();
}

/* ===== 画面: このアプリについて ===== */
function renderAbout(){
  const d=appData, s=d.source||{};
  const ov=getOverrides();
  $("#dataInfo").innerHTML=`
    <div>データ元</div><div>${safe(s.name||"—")} ${s.version?`v${safe(s.version)}`:""}</div>
    <div>収録ゲームVer.</div><div>${s.gameVersion?`〜 ${safe(s.gameVersion)}`:"—"}</div>
    <div>データ生成日時</div><div>${fmtDate(d.generatedAt)}</div>
    <div>最終取得日時</div><div>${fmtDate(localStorage.getItem(K.FETCHED_AT))}</div>
    <div>読込元</div><div>${safe(dataFrom)}</div>
    <div>件数</div><div>キャラ ${d.characters.length} / 天賦本 ${d.talentSeries.length} / 武器素材 ${(d.weaponSeries||[]).length} 系統</div>`;
  $("#localInfo").textContent=ov.length?`ローカル上書き：${ov.length}件`:"";
}

/* ===== UI: ドロワー/トースト/操作 ===== */
const drawer=$("#drawer"), overlay=$("#overlay");
function openDrawer(){ drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false"); overlay.style.display="block"; }
function closeDrawer(){ drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); overlay.style.display="none"; }
$("#btnMenu").onclick=()=> drawer.classList.contains("open")?closeDrawer():openDrawer();
overlay.onclick=closeDrawer;
drawer.querySelectorAll(".menu a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();setRoute(a.dataset.route);closeDrawer();}));
window.addEventListener("keydown",e=>{ if(e.key==="Escape" && drawer.classList.contains("open")) closeDrawer(); });

function toast(msg){
  const t=document.createElement("div");
  t.style.position="fixed"; t.style.left="50%"; t.style.bottom="22px"; t.style.transform="translateX(-50%)";
  t.style.background="var(--panel)"; t.style.border="1px solid var(--border)"; t.style.borderRadius="10px";
  t.style.padding="10px 14px"; t.style.boxShadow="var(--shadow)"; t.style.zIndex=2000; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}
$("#btnRefresh").onclick=async()=>{
  toast("最新データを取得中…");
  const ok=await loadLatest();
  setRoute(currentRoute);
  toast(ok?`更新しました（Ver.${appData.source?.gameVersion||"?"}まで）`:"取得に失敗しました（キャッシュを表示中）");
};

$("#btnReset").onclick=()=>{
  try{ [K.DATA,K.FETCHED_AT,K.FROM,K.LOCAL_OVERRIDES].forEach(k=>localStorage.removeItem(k)); }catch{}
  toast("キャッシュを削除しました。再読込します…");
  setTimeout(()=>location.reload(),600);
};
const file=$("#fileLocal");
$("#btnImport").onclick=()=>file.click();
file.onchange=()=>{ const f=file.files&&file.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const pack=normalizeLocalSchema(JSON.parse(r.result));
      localStorage.setItem(K.LOCAL_OVERRIDES,JSON.stringify(pack));
      toast(`ローカルJSONを読み込み：${pack.characters.length}件`);
      setRoute(currentRoute);
    }catch{ toast("JSONの読み込みに失敗しました"); }
    file.value="";
  };
  r.readAsText(f,"utf-8");
};
$("#btnExport").onclick=()=>{
  const minimal=view().characters.map(c=>({key:c.key,name:c.name,element:c.element,weapon:c.weapon,talentBooks:asArray(c.talentBooks)}));
  const blob=new Blob([JSON.stringify({characters:minimal},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="characters.local.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};

/* ===== 起動 ===== */
(async function init(){
  applyTheme(localStorage.getItem(K.THEME)||"auto",{save:false});
  loadCached();               // まずキャッシュで即表示
  setRoute("today");
  if(await loadLatest()) setRoute(currentRoute);   // 最新を取得して差し替え
  else if(dataFrom==="内蔵データ") toast("データを取得できませんでした（内蔵の最小データで表示中）");
})();
</script>
